# 실제 API 연동이 팀 main에 합쳐지면 이 파일로 운영 웹을 처음 배포합니다.
services:
  - type: web
    name: missu-web
    runtime: static
    branch: main
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - MissU_Frontend/**
    rootDir: MissU_Frontend
    buildCommand: npm ci --include=dev && EXPO_NO_DOTENV=1 CI=1 npx --no-install expo export --platform web
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: EXPO_PUBLIC_API_URL
        sync: false
      - key: EXPO_PUBLIC_POLICY_VERSION
        sync: false
