services:
  - type: web
    name: missu-api
    runtime: node
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - missu-backend/**
        - start-render-api.cjs
        - render.yaml
    plan: free
    region: singapore
    buildCommand: cd missu-backend && npm ci --include=dev && npm run build
    startCommand: cd missu-backend && npm run db:migrate && node ../start-render-api.cjs
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: missu-db
          property: connectionString
      - key: PII_KEY_SEED
        generateValue: true
      - key: SIGNING_KEY_SEED
        generateValue: true
      - key: POLICY_VERSION
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SMS_PROVIDER
        value: solapi
      - key: SOLAPI_API_KEY
        sync: false
      - key: SOLAPI_API_SECRET
        sync: false
      - key: SMS_FROM
        sync: false
      - key: STORAGE_PROVIDER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
databases:
  - name: missu-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    ipAllowList: []
