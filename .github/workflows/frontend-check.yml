name: Frontend checks

on:
  pull_request:
    paths:
      - 'MissU_Frontend/**'
      - '.github/workflows/frontend-check.yml'
      - '.editorconfig'
  push:
    branches: [main]
    paths:
      - 'MissU_Frontend/**'
      - '.github/workflows/frontend-check.yml'
      - '.editorconfig'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: MissU_Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: MissU_Frontend/package-lock.json
      - run: npm ci
      - run: npm run check
