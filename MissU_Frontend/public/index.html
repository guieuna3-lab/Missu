<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="missu-android-route" content="2" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="미슈" />
    <link rel="apple-touch-icon" sizes="180x180" href="/missu-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>미슈 · MissU</title>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #fff;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* 화면 여백은 SafeAreaView가 한 번 적용합니다. 상단에는 단색 배경만 칠합니다. */
      @media (display-mode: standalone) {
        @supports (-webkit-touch-callout: none) {
          html::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: max(1px, env(safe-area-inset-top, 0px));
            background-color: #fff;
            pointer-events: none;
            z-index: 2147483647;
          }
        }
      }
    </style>
  </head>
  <body>
    <noscript>미슈를 사용하려면 자바스크립트를 켜 주세요.</noscript>
    <div id="root"></div>
  </body>
</html>
